name: Update GitHub Activity

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Generate activity graphic
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");

            const query = `
              query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    totalCommitContributions
                    totalPullRequestContributions
                    totalPullRequestReviewContributions
                    totalIssueContributions
                  }
                }
              }
            `;

            const data = await github.graphql(query, {
              login: context.repo.owner
            });

            const c = data.user.contributionsCollection;
            const commits = c.totalCommitContributions;
            const prs = c.totalPullRequestContributions;
            const reviews = c.totalPullRequestReviewContributions;
            const issues = c.totalIssueContributions;
            const total = commits + prs + reviews + issues;

            const pct = (n) => total ? Math.round((n / total) * 100) : 0;

            let svg = fs.readFileSync("assets/github-activity.svg", "utf8");

            svg = svg
              .replaceAll("{{TOTAL}}", String(total))
              .replaceAll("{{COMMIT_PCT}}", String(pct(commits)))
              .replaceAll("{{PR_PCT}}", String(pct(prs)))
              .replaceAll("{{REVIEW_PCT}}", String(pct(reviews)))
              .replaceAll("{{ISSUE_PCT}}", String(pct(issues)));

            fs.writeFileSync("assets/github-activity.svg", svg);

      - name: Commit updated graphic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub activity"
          git push
